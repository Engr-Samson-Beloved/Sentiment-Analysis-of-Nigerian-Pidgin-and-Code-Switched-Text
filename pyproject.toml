[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "naija-sentiment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3.0,<5",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2",
  "PyYAML>=6",
  "scikit-learn>=1.3",
  "seaborn>=0.13",
  "streamlit>=1.40",
]
[project.optional-dependencies]
dev = ["pytest>=7"]
[project.scripts]
naija-sentiment = "naija_sentiment.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
