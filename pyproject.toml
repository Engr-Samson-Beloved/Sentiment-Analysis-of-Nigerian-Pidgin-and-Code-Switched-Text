[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "naija-sentiment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pandas>=2", "scikit-learn>=1.3", "joblib>=1.3", "PyYAML>=6"]
[project.optional-dependencies]
dev = ["pytest>=7"]
[project.scripts]
naija-sentiment = "naija_sentiment.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
